services:
  postgres:
    image: postgres:16
    container_name: officyna-billing-postgres
    environment:
      POSTGRES_DB: officyna_billing
      POSTGRES_USER: officyna
      POSTGRES_PASSWORD: officyna
    ports:
      - "5432:5432"
    volumes:
      - billing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U officyna -d officyna_billing"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  localstack:
    # Pinned em 3.0.2 (community, sem precisar de LOCALSTACK_AUTH_TOKEN) — tags mais novas
    # ("latest", "stable", "2026.x") passaram a exigir token mesmo pra SQS/SNS.
    image: localstack/localstack:3.0.2
    container_name: officyna-billing-localstack
    environment:
      SERVICES: sqs,sns
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "./localstack-init:/etc/localstack/init/ready.d"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: officyna-billing-app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/officyna_billing?user=officyna&password=officyna
      AWS_ENDPOINT_URL: http://localstack:4566
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET}
    ports:
      - "8086:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

volumes:
  billing_pg_data:
