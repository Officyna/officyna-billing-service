apiVersion: v1
kind: ConfigMap
metadata:
  name: officyna-billing-configmap
  namespace: officyna
data:
  SERVER_PORT: "8080"
  AWS_REGION: "us-east-1"
  AWS_SQS_GENERATE_PAYMENT_QUEUE: "officyna-billing-requests"
  AWS_SQS_BUDGET_GENERATED_QUEUE: "officyna-billing-responses"
  AWS_SNS_ORDER_PAID_TOPIC_NAME: "officyna-billing-order-paid"
