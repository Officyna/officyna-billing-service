apiVersion: v1
kind: ConfigMap
metadata:
  name: officyna-billing-configmap
  namespace: officyna
data:
  SERVER_PORT: "8080"
  AWS_REGION: "us-east-1"
  AWS_SQS_GENERATE_PAYMENT_QUEUE: "eventGeneratePayment"
  AWS_SQS_BUDGET_GENERATED_QUEUE: "eventBugetGenerated"
  AWS_SNS_ORDER_PAID_TOPIC_NAME: "topicAprovacao"
  AWS_SQS_SERVICE_ORDER_RECUSED_QUEUE: "eventServiceOrderRecusedPayment"
  AWS_SNS_REJECTION_TOPIC_NAME: "topicRejeicao"
  # Desligado de proposito: com isso em "true", todo Pix gerado ja sai aprovando sozinho no
  # sandbox (gatilho "APRO", ver MercadoPagoOrderGateway), o que atrapalha testar outros cenarios
  # (pagamento pendente, simular webhook na mao, etc). Ligar so quando quiser esse
  # comportamento especifico de novo.
  MERCADOPAGO_TEST_MODE: "false"
