name: CI/CD Pipeline (consolidado)

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply
      confirm:
        description: 'Para destroy, digite "destroy" para confirmar'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/officyna/officyna-billing-service
  JAVA_VERSION: "21"

jobs:
  build-test:
    name: Build e Testes
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar e executar testes (mvn verify)
        run: mvn --batch-mode --update-snapshots verify

      - name: Análise de qualidade (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn --batch-mode sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=officyna \
            -Dsonar.projectKey=officyna-billing-service

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  docker:
    name: Build e Push da Imagem Docker
    needs: build-test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir tags e metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # JOB: Deploy Aplicacao (Kubernetes)
  # ==========================================
  deploy-app:
    name: Deploy no Kubernetes
    needs: [docker]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Ler endpoint do banco (SSM Parameter Store)
        id: billingdb
        run: |
          ENDPOINT=$(aws ssm get-parameter --name "/officyna/billing-db/endpoint" --query "Parameter.Value" --output text)
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"

      - name: Atualizar kube config
        run: aws eks update-kubeconfig --name eks-officyna-service --region us-east-1

      - name: Aguardar nós prontos
        run: |
          echo "Aguardando nós prontos..."
          kubectl wait --for=condition=Ready nodes --all --timeout=600s || true

      - name: Instalar metrics-server (necessário para o HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

      - name: Instalar envsubst
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base

      # Sem passo de Kong aqui de propósito: billing-service expõe o webhook do Mercado Pago
      # direto via Service LoadBalancer (k8s/service.yaml), sem passar pelo gateway
      # compartilhado. O Kong continua 100% responsabilidade do pipeline do officyna-service
      # (que já aplica/remove os manifests dele) — ver README.

      - name: Aplicar configmap
        run: |
          kubectl create namespace officyna --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/configmap.yaml

      - name: Aplicar Secret
        env:
          BILLING_DB_ENDPOINT: ${{ steps.billingdb.outputs.endpoint }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD_BILLING_SERVICE }}
          MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.MERCADOPAGO_ACCESS_TOKEN }}
          MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.MERCADOPAGO_WEBHOOK_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          export SPRING_DATASOURCE_URL="jdbc:postgresql://${BILLING_DB_ENDPOINT}:5432/officyna_billing?user=officynabillingdbuser&password=${DB_PASSWORD}&sslmode=require"
          envsubst < k8s/secret.yaml | kubectl apply -f -

      - name: Criar imagePullSecret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ secrets.GHCR_USERNAME }} \
            --docker-password=${{ secrets.GHCR_PAT }} \
            --namespace=officyna \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar Deployment, Service e HPA
        run: |
          sed -i "s|image: ${IMAGE_NAME}:latest|image: ${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout da aplicação
        run: |
          kubectl rollout status deployment/officyna-billing-service -n officyna --timeout=300s
          kubectl get pods,svc,hpa -n officyna -l app.kubernetes.io/name=officyna-billing

      - name: Logs da aplicação
        run: |
          kubectl logs deployment/officyna-billing-service -n officyna

      - name: Obter e Publicar URL Pública da Aplicação
        run: |
          echo "Buscando endpoint público do billing-service..."
          ENDPOINT=""
          for i in $(seq 1 30); do
            ENDPOINT=$(kubectl get svc officyna-billing-service -n officyna -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -z "$ENDPOINT" ]; then
              ENDPOINT=$(kubectl get svc officyna-billing-service -n officyna -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            fi
            if [ -n "$ENDPOINT" ]; then
              break
            fi
            echo "Aguardando Load Balancer da AWS responder... (tentativa $i de 30)"
            sleep 10
          done

          if [ -z "$ENDPOINT" ]; then
            echo "⚠️ Deploy concluído, mas o Load Balancer ainda está em provisionamento na AWS" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🚀 Deploy Concluído com Sucesso!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Recurso | URL |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            echo "| 🌐 **Webhook Mercado Pago** | \`http://$ENDPOINT/api/v1/payments/webhook\` |" >> $GITHUB_STEP_SUMMARY
            echo "| 📚 **Swagger UI** | [Abrir Swagger](http://$ENDPOINT/swagger-ui.html) |" >> $GITHUB_STEP_SUMMARY
            echo "| ❤️ **Health Check** | [Ver Status](http://$ENDPOINT/actuator/health) |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          echo "===== PODS ====="
          kubectl get pods -n officyna -o wide

          echo "===== DESCRIBE POD ====="
          kubectl describe pod -n officyna -l app.kubernetes.io/name=officyna-billing

          echo "===== EVENTS ====="
          kubectl get events -n officyna --sort-by=.metadata.creationTimestamp

      - name: Logs do Pod
        if: failure()
        run: |
          POD=$(kubectl get pods -n officyna -l app.kubernetes.io/name=officyna-billing -o jsonpath='{.items[0].metadata.name}')

          echo "===== POD ====="
          echo "$POD"

          echo "===== LOGS ATUAIS ====="
          kubectl logs $POD -n officyna || true

          echo "===== LOGS ANTERIORES ====="
          kubectl logs $POD -n officyna --previous || true

  # ==========================================
  # JOB: Remover recursos do Kubernetes
  # ==========================================
  destroy-app:
    name: Remover aplicação do cluster
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' && github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Atualizar kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eks-officyna-service \
            --region ${{ secrets.AWS_REGION }} || \
          echo "Cluster EKS não encontrado (talvez já destruído); seguindo mesmo assim."

      - name: Remover recursos do Kubernetes
        run: |
          kubectl delete -f k8s/hpa.yaml --ignore-not-found=true || true
          kubectl delete -f k8s/service.yaml --ignore-not-found=true || true
          kubectl delete -f k8s/deployment.yaml --ignore-not-found=true || true
          kubectl delete -f k8s/secret.yaml --ignore-not-found=true || true
          kubectl delete -f k8s/configmap.yaml --ignore-not-found=true || true

      - name: Aguardar remoção do LoadBalancer
        run: |
          echo "Aguardando a AWS remover o LoadBalancer..."
          sleep 180
